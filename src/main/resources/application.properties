spring.application.name=sample-ms-security
server.port=8080

# Downstream services (overridden per environment)
clients.payment.url=http://localhost:9101
clients.inventory.url=http://localhost:9102
clients.customer.url=http://localhost:9103
clients.notification.url=http://localhost:9104

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
# feign-micrometer is picked up by Spring Cloud OpenFeign auto-configuration when this is true (default)
spring.cloud.openfeign.micrometer.enabled=true

# HMAC key for payment payload signing (sample value, not a secret)
signing.key=sample-ms-security-demo-key

sweeper.enabled=false

management.endpoints.web.exposure.include=health,info,mappings,metrics
springdoc.api-docs.path=/v3/api-docs
